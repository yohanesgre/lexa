name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LXK_SKIP_PREPARE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Restore wireframes submodule gracefully
        continue-on-error: true
        run: git submodule update --init --recursive || echo "wireframes submodule unavailable (private) - skipping wireframes checks"

      - name: Install native build deps (better-sqlite3)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 make g++

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Invariant compliance
        run: bun run check:invariants

      - name: Build (vite)
        run: bun run build

      - name: Docker build smoke
        timeout-minutes: 5
        run: |
          docker build -t lexa:ci .
          docker run -d --name lexa-ci -p 3001:3000 \
            -e LXK_API_KEY=test-ci-key \
            -e LXK_ADMIN_EMAILS=ci@example.com \
            lexa:ci
          echo "waiting for /api/health..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/api/health | grep -q '"ok":true'; then
              echo "health check passed: {\"ok\":true}"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Docker health check failed"
          docker logs lexa-ci || true
          curl -v http://localhost:3001/api/health || true
          exit 1

      - name: Cleanup Docker (always)
        if: always()
        run: docker rm -f lexa-ci >/dev/null 2>&1 || true

      - name: Audit dependencies
        continue-on-error: true
        run: |
          if bun audit --help >/dev/null 2>&1; then
            bun audit || echo "::warning::bun audit found vulnerabilities"
          elif bun pm audit --help >/dev/null 2>&1; then
            bun pm audit || echo "::warning::bun pm audit found vulnerabilities"
          else
            npm audit --audit-level=moderate || echo "::warning::npm audit found vulnerabilities"
          fi

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wireframes build check
        run: |
          if [ ! -d wireframes/src ]; then
            echo "wireframes/src missing - skipping wireframes build check"
            exit 0
          fi
          bash wireframes/build.sh
          if ! git diff --exit-code -- wireframes/dist; then
            echo "::error::wireframes/dist is dirty - run bash wireframes/build.sh and commit"
            exit 1
          fi

      - name: CLI compile check
        run: |
          bun run compile:cli
          if ! git diff --exit-code -- cli/src/packed.ts cli/src/packed-compose.ts; then
            echo "::error::cli/src/packed.ts or packed-compose.ts dirty after compile:cli - restore stubs before committing (git checkout -- cli/src/packed.ts cli/src/packed-compose.ts)"
            git diff -- cli/src/packed.ts cli/src/packed-compose.ts | head -n 100
            exit 1
          fi
          git checkout -- cli/src/packed.ts cli/src/packed-compose.ts 2>/dev/null || true
          rm -rf bin/lexa-cli bin/daemon-bundle.js 2>/dev/null || true

      - name: Lint
        continue-on-error: true
        run: |
          if [ -f .oxlintrc.json ] || [ -f oxlint.json ] || [ -f .oxlintrc.js ]; then
            echo "oxlint config found"
          else
            echo "no oxlint config found - will run with defaults or fallback"
          fi
          if [ -x ./node_modules/.bin/oxlint ]; then
            echo "running oxlint (warn mode)"
            ./node_modules/.bin/oxlint . || echo "::warning::oxlint found warnings"
          elif bun pm ls oxlint >/dev/null 2>&1; then
            echo "running bunx oxlint (warn mode)"
            bunx oxlint . || echo "::warning::oxlint found warnings"
          else
            echo "oxlint not found, falling back to bun run doctor"
            bun run doctor || echo "::warning::doctor found warnings"
          fi

      - name: Prettier check
        continue-on-error: true
        run: |
          if ls .prettierrc* prettier.config.* 1>/dev/null 2>&1; then
            echo "prettier config found - checking format"
            if [ -x ./node_modules/.bin/prettier ]; then
              ./node_modules/.bin/prettier --check . || echo "::warning::prettier formatting issues"
            else
              bunx prettier --check . || echo "::warning::prettier formatting issues (or prettier not installed)"
            fi
          else
            echo "no prettier config - skipping prettier check"
          fi

      - name: Knip / depcheck (warn)
        continue-on-error: true
        run: |
          if [ -x ./node_modules/.bin/knip ]; then
            echo "running knip (warn mode)"
            ./node_modules/.bin/knip --no-progress || echo "::warning::knip found issues"
          elif bun pm ls knip >/dev/null 2>&1; then
            echo "running bunx knip (warn mode)"
            bunx knip --no-progress || echo "::warning::knip found issues"
          elif [ -x ./node_modules/.bin/depcheck ]; then
            echo "running depcheck (warn mode)"
            ./node_modules/.bin/depcheck || echo "::warning::depcheck found issues"
          else
            echo "knip/depcheck not installed - skipping (install knip to enable)"
          fi

      - name: Coverage (v8)
        continue-on-error: true
        run: |
          echo "running coverage with v8 provider (thresholds 60% server/shared)"
          set +e
          bunx vitest run --coverage --coverage.provider=v8 --coverage.reporter=text --coverage.reporter=lcov --coverage.thresholds.lines 60 --coverage.thresholds.functions 60 --coverage.thresholds.branches 60 --coverage.thresholds.statements 60 --coverage.include="server/**" --coverage.include="shared/**" 2>&1 | tee /tmp/coverage.log
          rc=${PIPESTATUS[0]}
          if [ $rc -eq 0 ]; then
            echo "coverage thresholds passed"
            exit 0
          fi
          if grep -qiE "MISSING DEPENDENCY|Cannot find dependency.*coverage" /tmp/coverage.log; then
            echo "::warning::coverage provider missing (rc=$rc, is @vitest/coverage-v8 installed?)"
            exit 0
          fi
          echo "::warning::coverage thresholds not met (rc=$rc) - warn not hard"
          exit 0

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: |
            coverage/lcov.info
            coverage/coverage-final.json
            coverage/lcov-report/**
          if-no-files-found: ignore

      - name: Tag / changelog guard
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "tag guard: $TAG ref=$GITHUB_REF"
          if [[ "$TAG" == cli-v* ]]; then
            VER="${TAG#cli-v}"
            PKG_VER=$(bun -e "console.log(require('./cli/package.json').version)")
            if [ "$PKG_VER" != "$VER" ]; then
              echo "::error::cli/package.json version $PKG_VER does not match tag $TAG (expected cli-v$PKG_VER)"
              exit 1
            fi
            if ! grep -qE "## \[${VER}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" cli/CHANGELOG.md; then
              echo "::error::cli/CHANGELOG.md missing dated section ## [$VER] - YYYY-MM-DD for tag $TAG"
              exit 1
            fi
            echo "cli tag guard passed: $TAG matches cli/package.json $PKG_VER and cli/CHANGELOG.md"
          else
            VER="${TAG#v}"
            PKG_VER=$(bun -e "console.log(require('./package.json').version)")
            if [ "$PKG_VER" != "$VER" ]; then
              echo "::error::package.json version $PKG_VER does not match tag $TAG (expected v$PKG_VER)"
              exit 1
            fi
            if ! grep -qE "## \[${VER}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md; then
              echo "::error::CHANGELOG.md missing dated section ## [$VER] - YYYY-MM-DD for tag $TAG"
              exit 1
            fi
            echo "tag guard passed: $TAG matches package.json $PKG_VER and CHANGELOG.md"
          fi

      - name: Check mobile
        continue-on-error: true
        run: |
          if ! grep -q '"check:mobile"' package.json; then
            echo "check:mobile script not found in package.json - skipping"
            exit 0
          fi
          if ! npx playwright --version >/dev/null 2>&1; then
            echo "::warning::playwright not installed - skipping check:mobile"
            exit 0
          fi
          npx playwright install chromium --with-deps 2>&1 || echo "::warning::playwright install failed - continuing"
          echo "running bun run check:mobile"
          bun run check:mobile 2>&1 | tee /tmp/check-mobile.log
          rc=${PIPESTATUS[0]:-$?}
          if [ $rc -eq 0 ]; then
            echo "check:mobile passed"
            exit 0
          fi
          if grep -qiE "Executable doesn't exist|chrome-headless-shell|browserType\.launch|playwright install" /tmp/check-mobile.log; then
            echo "::warning::playwright browsers missing (rc=$rc) - warn not hard"
            exit 0
          fi
          echo "::warning::check:mobile failed (rc=$rc) - warn not hard"
          exit 0
