name: publish-cli

# CLI releases are INDEPENDENT of web app releases (see publish.yml):
#   cli-vX.Y.Z tags → build the binary + attach it to the GitHub release
#   vX.Y.Z tags     → web app image to ghcr.io (publish.yml)
# install-cli.sh and `lx upgrade` resolve the newest cli-v* release.

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify CLI version matches tag
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          PKG_VERSION=$(bun -e "console.log(require('./cli/package.json').version)")
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::cli/package.json version $PKG_VERSION does not match tag ${GITHUB_REF_NAME} (expected cli-v${PKG_VERSION})"
            exit 1
          fi

      - name: Compile CLI
        run: bun run compile:cli

      - name: Extract latest changelog entry
        run: awk '/^## \[/{ if (seen) exit; seen=1; next } seen { print }' cli/CHANGELOG.md > /tmp/cli-notes.md

      - name: Create release with the binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Retargeting/re-running a cli-v* tag must not fail on the existing
        # release: delete it first (ignore "not found"), then recreate with
        # the freshly compiled binary. gh release create has no --clobber.
        # Rename transition: publish `lx` plus the legacy `lexa-cli` asset for
        # one cycle so pre-rename installers keep resolving the old name.
        run: |
          gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true
          cp bin/lx bin/lexa-cli
          gh release create "${{ github.ref_name }}" bin/lx bin/lexa-cli --notes-file /tmp/cli-notes.md

      - name: Warm installer + smoke
        if: startsWith(github.ref, 'refs/tags/')
        env:
          INSTALLER_HOOK_SECRET: ${{ secrets.INSTALLER_HOOK_SECRET }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          curl -fsSL -X POST https://install.yohanesgre.com/lexa/hooks/warm \
            -H "Authorization: Bearer ${INSTALLER_HOOK_SECRET}" \
            -H 'Content-Type: application/json' \
            --data "{\"channel\":\"cli\",\"tag\":\"${TAG}\"}"
          for i in $(seq 1 28); do
            RESOLVED=$(curl -sSI https://install.yohanesgre.com/lexa/install-cli.sh \
              | { grep -i '^X-Resolved-Tag:' || true; } | tr -d '\r' | awk '{print $2}')
            if [ "${RESOLVED}" = "${TAG}" ]; then
              echo "installer serving ${TAG}"
              exit 0
            fi
            sleep 15
          done
          echo "::error::installer did not serve ${TAG} within ~7 min"
          exit 1
