name: publish-image

on:
  workflow_dispatch:
# Disabled — publish-image not used during C2 (restore push/tags to re-enable)
#  push:
#    branches: [main]
#    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: false # disabled — publish-image not used (C2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # main → staging image; v* tags → latest + version-pinned (prod).
          # NB: `false && x` yields boolean false, which stringifies as the
          # literal tag "false" — always fall back to a string ('...' or '').
          # Empty lines are filtered by build-push-action's tag parsing.
          tags: |
            ${{ github.ref_type == 'tag' && 'ghcr.io/yohanesgre/lexa:latest' || 'ghcr.io/yohanesgre/lexa:staging' }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/yohanesgre/lexa:{0}', github.ref_name) || '' }}
