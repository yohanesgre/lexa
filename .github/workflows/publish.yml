name: publish-image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "wireframes/**", "status/**", ".agents/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${{ github.ref_name }}"
            VER="${VER#v}"
            {
              echo "tags<<EOF"
              echo "ghcr.io/yohanesgre/lexa:latest"
              echo "ghcr.io/yohanesgre/lexa:v${VER}"
              echo "ghcr.io/yohanesgre/lexa:${VER%.*}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/yohanesgre/lexa:staging" >> "$GITHUB_OUTPUT"
          fi
        id: tags

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.tags.outputs.tags }}
          sbom: true
          labels: |
            org.opencontainers.image.title=Lexa
            org.opencontainers.image.description=Self-hosted project management for small teams
            org.opencontainers.image.source=https://github.com/yohanesgre/lexa
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
