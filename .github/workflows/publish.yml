name: publish-workers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tarballs:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          LXK_SKIP_PREPARE: "1"

      - name: Build workers flavor
        run: LEXA_FLAVOR=workers bun run build
        env:
          LXK_SKIP_PREPARE: "1"

      - name: Package workers tarball
        run: |
          # Strip the placeholder database_id — the install-script provisioner
          # binds the real D1 id into a per-deploy wrangler config.
          mkdir -p workers-stage/scripts
          sed '/"database_id": "00000000-0000-0000-0000-000000000000"/d' \
            wrangler.jsonc > workers-stage/wrangler.jsonc
          cp -r dist migrations workers-stage/
          # package.json rides along so the deploy can stamp LXK_VERSION from
          # the repo version (readDeployVersion reads it from the deploy dir).
          cp package.json workers-stage/
          # The workers installer helper (bun workers-install.ts) rides in the
          # tarball — install.sh unpacks and runs it with bun.
          cp scripts/workers-install.ts workers-stage/scripts/
          # The installer imports ./lib/cf-deploy; stage the shared helper dir
          # next to it so the bundled script resolves in the unpacked tarball.
          cp -r scripts/lib workers-stage/scripts/
          tar czf "lexa-workers-${{ github.ref_name }}.tar.gz" \
            --exclude='*/.dev.vars' \
            -C workers-stage dist wrangler.jsonc migrations scripts package.json

      - name: Checksums
        run: |
          sha256sum "lexa-workers-${{ github.ref_name }}.tar.gz" > checksums.txt

      - name: Attach artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" --generate-notes \
            "lexa-workers-${TAG}.tar.gz" checksums.txt \
          || gh release upload "$TAG" \
            "lexa-workers-${TAG}.tar.gz" checksums.txt --clobber

      - name: Warm installer + smoke
        if: startsWith(github.ref, 'refs/tags/')
        env:
          INSTALLER_HOOK_SECRET: ${{ secrets.INSTALLER_HOOK_SECRET }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          curl -fsSL -X POST https://install.yohanesgre.com/lexa/hooks/warm \
            -H "Authorization: Bearer ${INSTALLER_HOOK_SECRET}" \
            -H 'Content-Type: application/json' \
            --data "{\"channel\":\"app\",\"tag\":\"${TAG}\"}"
          for i in $(seq 1 28); do
            RESOLVED=$(curl -sSI https://install.yohanesgre.com/lexa/install.sh \
              | { grep -i '^X-Resolved-Tag:' || true; } | tr -d '\r' | awk '{print $2}')
            if [ "${RESOLVED}" = "${TAG}" ]; then
              echo "installer serving ${TAG}"
              exit 0
            fi
            sleep 15
          done
          echo "::error::installer did not serve ${TAG} within ~7 min"
          exit 1
