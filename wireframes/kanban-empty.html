<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexa — Kanban: Empty Board</title>
  <link rel="stylesheet" href="wireframes.css" />
</head>
<body class="bg-app color-primary">

  <nav class="app-nav">
    <a href="index.html" class="nav-brand">Lexa</a>
    <div class="nav-links">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="kanban.html" class="nav-link">Board</a>
      <a href="wiki.html" class="nav-link">Wiki</a>
      <a href="settings.html" class="nav-link">Settings</a>
    </div>
    <div class="nav-spacer"></div>
    <div class="nav-right">
      <div class="project-switcher">
        <button class="project-switcher-trigger">
          <span class="text-sm weight-500 font-body color-primary">Emberfall</span>
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
      <div style="position:relative;">
        <button style="display:flex;align-items:center;gap:8px;height:28px;padding:0 8px 0 6px;background:transparent;border:1px solid var(--lx-border-default);border-radius:6px;color:var(--lx-text-primary);cursor:pointer;">
          <div class="avatar" style="width:20px;height:20px;font-size:10px;">Y</div>
          <span class="text-sm weight-500" style="line-height:1;">Yohanes</span>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="flex-shrink:0;"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <div class="board-area">
    <!-- Board Header -->
    <div class="board-header">
      <div class="flex items-center gap-3">
        <h1 class="font-display text-xl weight-600 color-primary">Emberfall</h1>
        <span class="annotation-tag">State: empty board — new project, no columns, no swimlanes</span>
      </div>
      <div class="flex items-center gap-2">
                        <button class="btn btn-ghost text-sm">Filter</button>
                        <button class="btn btn-ghost text-sm">Settings</button>
      </div>
    </div>

    <!-- Board Scroll Area: empty state -->
    <div class="board-scroll" style="align-items:center;justify-content:center;">

      <div class="empty-state" style="padding:24px;">
        <div class="empty-state-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></svg>
        </div>
        <div class="empty-state-title">No columns yet</div>
        <div class="empty-state-desc">Add a column to start tracking tasks.</div>
        <button class="btn btn-primary" style="margin-top:16px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14m-7-7h14"/></svg>
          Add Column
        </button>
        <div class="mt-4 flex flex-col items-center gap-2">
          <span class="annotation-tag">first column also creates the default swimlane</span>
          <span class="annotation-tag">Add Column → column create modal (see kanban-column-settings-modal)</span>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
