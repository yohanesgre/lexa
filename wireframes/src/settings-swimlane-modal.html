<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexa — Settings (Create Swimlane Modal)</title>
  <link rel="stylesheet" href="wireframes.css" />
</head>
<body class="bg-app color-primary" style="min-height:100vh;position:relative;overflow:hidden;">

  <!-- Dimmed Settings Backdrop (Swimlanes section) -->
  <div style="position:absolute;inset:0;opacity:0.25;pointer-events:none;overflow:hidden;">
    <INCLUDE navbar.html />
    <main class="page-frame">
      <h1 class="font-display text-2xl weight-600 color-primary mb-4">Settings</h1>
      <section>
        <h2 class="font-display text-lg weight-500 color-primary mb-3">Swimlanes</h2>
        <div style="background:var(--lx-surface-card);border:1px solid var(--lx-border-default);border-radius:8px;overflow:hidden;">
          <table class="settings-table">
            <thead>
              <tr><th style="width:40px;"></th><th>Name</th><th>Description</th></tr>
            </thead>
            <tbody>
              <tr>
                <td></td>
                <td class="text-sm weight-500">Sprint 7 — The Furnace</td>
                <td class="text-xs color-secondary">Current sprint — furnace tilemap &amp; combat</td>
              </tr>
              <tr>
                <td></td>
                <td class="text-sm weight-500">Sprint 6 — Ash &amp; Bone</td>
                <td class="text-xs color-muted">—</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="mt-3">
          <button class="btn btn-ghost">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14m-7-7h14"/></svg>
            Add Swimlane
          </button>
        </div>
      </section>
    </main>
  </div>

  <!-- Overlay -->
  <div class="slideover-overlay"></div>

  <!-- Create Swimlane Modal -->
  <div class="modal dialog-enter">
    <div class="modal-header">
      <span class="modal-title">Create Swimlane</span>
      <button class="btn btn-ghost" style="width:32px;height:32px;padding:0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="modal-body">
      <div class="field">
        <label class="field-label">Name</label>
        <input class="prop-input w-full" value="Sprint 8 — The Hollow Crown" />
      </div>

      <div class="field">
        <label class="field-label">
          Description
          <span class="font-micro text-2xs color-muted" style="text-transform:uppercase;letter-spacing:0.04em;margin-left:6px;">Optional</span>
        </label>
        <textarea class="prop-input w-full" placeholder="e.g. Release track, team, or sprint goal"></textarea>
        <div class="field-hint">Shown as a subtitle under the swimlane header on the board.</div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost">Cancel</button>
      <button class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14m-7-7h14"/></svg>
        Create Swimlane
      </button>
    </div>
  </div>

  <!-- Annotations -->
  <div style="position:fixed;top:calc(50% - 140px);left:calc(50% + 232px);z-index:55;">
    <span class="annotation-tag">Same modal for Edit (title: "Edit Swimlane")</span>
  </div>
  <div style="position:fixed;top:calc(50% + 40px);left:calc(50% + 232px);z-index:55;">
    <span class="annotation-tag">Description is optional and stored as plain text</span>
  </div>

</body>
</html>
