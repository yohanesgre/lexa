<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexa — Kanban: Empty Board</title>
  <link rel="stylesheet" href="wireframes.css" />
</head>
<body class="bg-app color-primary">

  <INCLUDE navbar.html />

  <div class="board-area">
    <!-- Board Header -->
    <div class="board-header">
      <div class="flex items-center gap-3">
        <h1 class="font-display text-xl weight-600 color-primary">Emberfall</h1>
        <span class="annotation-tag">State: empty board — new project, no columns, no swimlanes</span>
      </div>
      <div class="flex items-center gap-2">
                <INCLUDE _board-header-buttons.html />
      </div>
    </div>

    <!-- Board Scroll Area: empty state -->
    <div class="board-scroll" style="align-items:center;justify-content:center;">

      <div class="empty-state" style="padding:24px;">
        <div class="empty-state-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></svg>
        </div>
        <div class="empty-state-title">No columns yet</div>
        <div class="empty-state-desc">Add a column to start tracking tasks.</div>
        <button class="btn btn-primary" style="margin-top:16px;">
          <INCLUDE _plus-icon.html />
          Add Column
        </button>
        <div class="mt-4 flex flex-col items-center gap-2">
          <span class="annotation-tag">first column also creates the default swimlane</span>
          <span class="annotation-tag">Add Column → column create modal (see kanban-column-settings-modal)</span>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
