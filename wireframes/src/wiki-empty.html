<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexa — Wiki: Empty State</title>
  <link rel="stylesheet" href="wireframes.css" />
</head>
<body class="bg-app color-primary" style="min-height:100vh;">

  <INCLUDE navbar.html />

  <div class="wiki-layout">
    <!-- Sidebar: no tree, only the Add page CTA -->
    <aside class="wiki-sidebar">
      <div class="px-4 mb-3">
        <span class="font-micro text-2xs color-muted" style="text-transform:uppercase;letter-spacing:0.04em;">000 Pages</span>
        <div class="mt-1">
          <span class="annotation-tag">No tree when project has no pages</span>
        </div>
      </div>

      <div class="flex-1"></div>

      <!-- Add page button: the only sidebar CTA -->
      <div class="px-3 mt-2">
        <button class="add-task-btn" style="justify-content:flex-start;padding-left:12px;">
          <INCLUDE _plus-icon.html />
          New page
        </button>
        <span class="annotation-inline">Only CTA</span>
      </div>
    </aside>

    <!-- Content: empty state -->
    <div class="wiki-content flex items-center justify-center">
      <div style="text-align:center;max-width:380px;border:1px dashed var(--lx-border-strong);border-radius:12px;padding:56px 40px;">

        <div class="flex justify-center mb-3">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--lx-text-muted);"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
        </div>

        <h2 class="font-display text-xl weight-600 color-primary mb-2">No pages yet</h2>
        <p class="text-sm color-secondary mb-4" style="line-height:20px;">
          The wiki is where design docs, combat formulas, and art direction live. Pages can be nested to mirror how your team thinks.
        </p>

        <button class="btn btn-primary">
          <INCLUDE _plus-icon.html />
          Create the first page
        </button>

        <div class="mt-3">
          <span class="annotation-tag">Empty state: 24px icon, Display heading, dashed panel, primary CTA</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
