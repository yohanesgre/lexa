<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexa — Wiki: Empty State</title>
  <link rel="stylesheet" href="wireframes.css" />
</head>
<body class="bg-app color-primary" style="min-height:100vh;">

  <nav class="app-nav">
    <a href="index.html" class="nav-brand">Lexa</a>
    <div class="nav-links">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="kanban.html" class="nav-link">Board</a>
      <a href="wiki.html" class="nav-link">Wiki</a>
      <a href="settings.html" class="nav-link">Settings</a>
    </div>
    <div class="nav-spacer"></div>
    <div class="nav-right">
      <div class="project-switcher">
        <button class="project-switcher-trigger">
          <span class="text-sm weight-500 font-body color-primary">Emberfall</span>
          <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
      <div style="position:relative;">
        <button style="display:flex;align-items:center;gap:8px;height:28px;padding:0 8px 0 6px;background:transparent;border:1px solid var(--lx-border-default);border-radius:6px;color:var(--lx-text-primary);cursor:pointer;">
          <div class="avatar" style="width:20px;height:20px;font-size:10px;">Y</div>
          <span class="text-sm weight-500" style="line-height:1;">Yohanes</span>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="flex-shrink:0;"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <div class="wiki-layout">
    <!-- Sidebar: no tree, only the Add page CTA -->
    <aside class="wiki-sidebar">
      <div class="px-4 mb-3">
        <span class="font-micro text-2xs color-muted" style="text-transform:uppercase;letter-spacing:0.04em;">000 Pages</span>
        <div class="mt-1">
          <span class="annotation-tag">No tree when project has no pages</span>
        </div>
      </div>

      <div class="flex-1"></div>

      <!-- Add page button: the only sidebar CTA -->
      <div class="px-3 mt-2">
        <button class="add-task-btn" style="justify-content:flex-start;padding-left:12px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14m-7-7h14"/></svg>
          New page
        </button>
        <span class="annotation-inline">Only CTA</span>
      </div>
    </aside>

    <!-- Content: empty state -->
    <div class="wiki-content flex items-center justify-center">
      <div style="text-align:center;max-width:380px;border:1px dashed var(--lx-border-strong);border-radius:12px;padding:56px 40px;">

        <div class="flex justify-center mb-3">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--lx-text-muted);"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
        </div>

        <h2 class="font-display text-xl weight-600 color-primary mb-2">No pages yet</h2>
        <p class="text-sm color-secondary mb-4" style="line-height:20px;">
          The wiki is where design docs, combat formulas, and art direction live. Pages can be nested to mirror how your team thinks.
        </p>

        <button class="btn btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14m-7-7h14"/></svg>
          Create the first page
        </button>

        <div class="mt-3">
          <span class="annotation-tag">Empty state: 24px icon, Display heading, dashed panel, primary CTA</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
