services:
  app:
    # Default = latest; `lexa-cli deploy --image <tag>` overrides via LXK_IMAGE_TAG.
    image: ghcr.io/yohanesgre/lexa:${LXK_IMAGE_TAG:-latest}
    volumes:
      - lexa-data:/app/data
    environment:
      - DATABASE_PATH=/app/data/lexa.db
      - PORT=3000
      - LXK_ENV=${LXK_ENV:-}
      - LXK_API_KEY=${LXK_API_KEY}
      - LXK_ADMIN_EMAILS=${LXK_ADMIN_EMAILS:-}
      - LXK_HEARTH_DAEMON_TOKEN=${LXK_HEARTH_DAEMON_TOKEN:-}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY:-}
      - GITHUB_PRIVATE_KEY_FILE=${GITHUB_PRIVATE_KEY_FILE:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - LXK_ACCESS_AUD=${LXK_ACCESS_AUD:-}
      - LXK_ACCESS_TEAM=${LXK_ACCESS_TEAM:-}
      - LXK_MAX_BODY_MB=${LXK_MAX_BODY_MB:-}
      - LOG_LEVEL=${LOG_LEVEL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/health').catch(() => process.exit(1))"]
      interval: 30s
      retries: 3
      start_period: 10s

volumes:
  lexa-data:
